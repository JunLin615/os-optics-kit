<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2312263a'/%3E%3Cpolygon points='12,4 20,18 4,18' fill='none' stroke='%2338bdf8' stroke-width='2'/%3E%3Cline x1='2' y1='13' x2='10' y2='11' stroke='%23f59e0b' stroke-width='2'/%3E%3Cline x1='14' y1='11' x2='22' y2='14' stroke='%2310b981' stroke-width='2'/%3E%3C/svg%3E">
  <title>OS Optics Local Viewer</title>
  <link rel="stylesheet" href="/assets/viewer.css">
</head>
<body>
<div id="app" data-revision="0" data-snapshot-id="">
  <header class="topbar">
    <div class="topbar-left">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
          <rect width="24" height="24" rx="6" fill="currentColor" class="mark-bg"/>
          <polygon points="12,4.5 19.5,18 4.5,18" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
          <line x1="2.5" y1="12.8" x2="9.6" y2="11.4" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="14.4" y1="11.4" x2="21.5" y2="14.2" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-title-wrap">
        <h1 id="app-title">OS Optics Local Viewer</h1>
        <span class="pill pill-subtle" id="badge-readonly">Read-only</span>
      </div>
      <div class="status-pills">
        <span class="pill pill-live" id="badge-live"><span class="live-dot"></span><span id="badge-live-text">Connecting</span></span>
        <span class="pill" id="badge-mode">Loading…</span>
        <span class="pill hidden" id="badge-freshness" aria-hidden="true"></span>
        <span class="pill pill-mono" id="badge-rev">Rev #0</span>
      </div>
    </div>

    <div class="topbar-right">
      <div class="source-chip" id="source-path" title=""></div>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" id="btn-lang-en" data-lang="en">EN</button>
        <button type="button" class="lang-btn" id="btn-lang-zh" data-lang="zh">中文</button>
      </div>
    </div>
  </header>

  <div id="banner-stack" class="banner-stack">
    <div id="banner-error" class="banner banner-warning hidden" role="status" aria-live="polite"></div>
    <div id="banner-notices" class="notices"></div>
  </div>

  <main class="workspace">
    <section class="viewport-pane" aria-label="3D Optical Scene">
      <div class="pane-header">
        <div class="pane-title-group">
          <h2 id="lbl-scene-title">Optical Path &amp; Traced Rays</h2>
          <span class="pill pill-info hidden" id="badge-geom-only" aria-hidden="true"></span>
          <span class="pill pill-warn hidden" id="badge-schematic" aria-hidden="true"></span>
        </div>
        <div class="pane-meta" id="scene-meta"></div>
      </div>

      <div class="viewport-frame-wrap">
        <iframe id="engine-frame-a" class="engine-frame active" title="Interactive 3D Optical Simulation View"></iframe>
        <iframe id="engine-frame-b" class="engine-frame staging" title="Interactive 3D Optical Simulation View Staging" aria-hidden="true"></iframe>
        <div id="frame-updating" class="frame-updating hidden" aria-hidden="true"></div>
      </div>

      <div class="viewport-footer">
        <div class="branch-chips" id="scene-branch-chips"></div>
        <div class="binding-stamp" id="binding-stamp"></div>
      </div>
    </section>

    <aside class="inspector-pane" aria-label="Simulation Inspector">
      <section class="card" id="card-execution">
        <div class="card-head">
          <h3 id="lbl-exec-title">Result Status</h3>
          <span class="card-sub" id="exec-subtitle"></span>
        </div>
        <div id="execution-kpis" class="kpi-grid"></div>
        <div id="execution-alerts" class="inline-alerts"></div>
      </section>

      <section class="card" id="card-power">
        <div class="card-head">
          <h3 id="lbl-power-title">Power Ledger</h3>
          <span class="pill hidden" id="badge-conserved" aria-hidden="true"></span>
        </div>
        <div id="power-body"></div>
      </section>

      <section class="card" id="card-targets">
        <div class="card-head">
          <h3 id="lbl-targets-title">Target Assessments</h3>
          <div class="mini-counts" id="targets-summary-pills"></div>
        </div>
        <div id="targets-body"></div>
      </section>

      <section class="card" id="card-quantities">
        <div class="card-head">
          <h3 id="lbl-quantities-title">Observation Planes</h3>
          <span class="card-sub" id="quantities-count"></span>
        </div>
        <div id="quantities-body"></div>
      </section>

      <section class="card" id="card-branches">
        <div class="card-head">
          <h3 id="lbl-branches-title">Traced Branches</h3>
          <span class="card-sub" id="branches-count"></span>
        </div>
        <div id="branches-body"></div>
      </section>

      <details class="card details-card" id="card-details">
        <summary class="details-summary">
          <span id="lbl-details-title">Snapshot &amp; Source Details</span>
          <span class="details-hint" id="details-hint"></span>
        </summary>
        <div id="details-body" class="details-body"></div>
      </details>
    </aside>
  </main>
</div>
<script src="/assets/viewer.js"></script>
</body>
</html>
