name: Release

# A published GitHub release builds the distributions and publishes them to PyPI through Trusted Publishing
# (environment "pypi"). A manual run only builds and checks them.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: The release tag names this version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("tools/os_optics_kit/_version.py").read_text(encoding="utf-8")
          print(re.search(r'^__version__ = "([^"]+)"', text, re.M).group(1))
          PY
          )
          if [[ "${TAG#v}" != "$version" ]]; then
            echo "::error::Release tag $TAG does not match os-optics-kit $version"
            exit 1
          fi
      - name: Repository checks (baseline.json agrees with the package)
        run: python scripts/check_repo.py
      - name: Build
        run: python -m build
      - name: Check metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/os-optics-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
