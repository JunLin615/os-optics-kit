name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Pull-request code never receives a write token or secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    name: Read baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.baseline.outputs.python }}
      newest: ${{ steps.baseline.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: baseline.json
          sparse-checkout-cone-mode: false
      - name: Python versions from baseline.json
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          with open("baseline.json", encoding="utf-8") as source:
              versions = json.load(source)["python"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("python=" + json.dumps(versions) + "\n")
              output.write("newest=" + versions[-1] + "\n")
          PY

  ruff:
    name: Lint (ruff)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest }}
      - name: Install the development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: ruff check --output-format=github .

  mypy:
    name: Types (mypy)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest }}
      - name: Install the development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - run: mypy

  tests:
    name: Unit tests (Python ${{ matrix.python }}, no engine)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.setup.outputs.python) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the kit without the engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m pip install --no-deps -e .
          if python -c "import os_optics" 2>/dev/null; then
            echo "::error::os-optics is installed; this job checks the kit without the engine"
            exit 1
          fi
      - name: Tests (engine-dependent tests skip themselves)
        run: python -m pytest

  repository:
    name: Repository, skills and cases
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest }}
      - name: Links, file sizes, paths, secrets, JSON, baseline, pins and language pairs
        run: python scripts/check_repo.py
      - name: Install the kit without the engine
        if: ${{ !cancelled() }}
        run: python -m pip install --no-deps -e .
      - name: skills.json is current
        if: ${{ !cancelled() }}
        run: python -m os_optics_kit skills index --check
      - name: cases.json is current
        if: ${{ !cancelled() }}
        run: python -m os_optics_kit cases index --check
      - name: README case tables are current
        if: ${{ !cancelled() }}
        run: python scripts/case_tables.py --check

  package:
    name: Build and install the package
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest }}
      - name: Build the wheel and source archive
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m build
      - name: Check metadata and contents
        run: |
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist
      - name: Clean install without dependencies, then smoke-test
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          kit="$RUNNER_TEMP/smoke/bin/os-optics-kit"
          "$kit" --help
          "$kit" --version
          "$kit" skills list
          "$kit" cases list
          "$kit" skills install --dest "$RUNNER_TEMP/skills-out"
          test -f "$RUNNER_TEMP/skills-out/skills.json"
          if "$RUNNER_TEMP/smoke/bin/python" -c "import os_optics" 2>/dev/null; then
            echo "::error::os-optics was installed by a --no-deps install"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_dco.py "$BASE" "$HEAD"

  engine:
    name: Engine checks (published os-optics)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Read this repository's artifacts: a tree already verified in full is not verified again.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.setup.outputs.newest }}
      - name: Is the verified engine on PyPI?
        id: gate
        run: python scripts/engine_release.py
      - name: Chinese fonts for the figure tests
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk
      - name: Cases to verify
        id: cases
        if: steps.gate.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request verifies the cases it changes, or all of them; main and the merge queue verify all.
          if [[ "$EVENT" == "pull_request" ]]; then
            python scripts/changed_cases.py --event pull_request "$BASE" "$HEAD"
          else
            python scripts/changed_cases.py --event "$EVENT"
          fi
      - name: Tests and tools against the published engine and the pinned catalog
        if: steps.gate.outputs.run == 'true'
        # The cases are verified once, by the "Verify cases" step.
        run: python scripts/check_alignment.py --out run-alignment --skip cases-verify
      - name: Render with published engine and Chrome
        if: steps.gate.outputs.run == 'true'
        run: |
          run-alignment/.venv/bin/python -m pip install 'playwright>=1.50,<2'
          run-alignment/.venv/bin/python -c "from os_optics_kit.render_views import find_browser; assert find_browser(None), 'Chrome/Chromium is required'"
          run-alignment/.venv/bin/python -m pytest tests/test_render_browser.py --basetemp=run-alignment/render-proof --junitxml=run-alignment/render-tests.xml
      - name: Presentation with published engine, Chrome and MP4 encoder
        if: steps.gate.outputs.run == 'true'
        env:
          # missing fonts, browser or media encoder fail these tests instead of skipping them
          OS_OPTICS_KIT_REQUIRE_PRESENTATION: "1"
        run: |
          run-alignment/.venv/bin/python -m pip install 'imageio-ffmpeg>=0.5,<1'
          run-alignment/.venv/bin/python -m pytest tests/test_present.py tests/test_present_gallery.py             tests/test_present_compose.py tests/test_present_animate.py             --basetemp=run-alignment/present-proof --junitxml=run-alignment/present-tests.xml
      - name: Look for a full verification of this tree
        id: verified
        if: >-
          ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.cases.outcome == 'success'
          && github.event_name != 'pull_request' }}
        # Fail safe: if this step breaks, nothing is accepted and every case is verified.
        continue-on-error: true
        env:
          # The only step that gets the token (actions: read); the case runs never see it.
          GITHUB_TOKEN: ${{ github.token }}
          TREE: ${{ steps.cases.outputs.tree }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: python scripts/verified_tree.py lookup --tree "$TREE" --repository "$REPOSITORY" --repository-id "$REPOSITORY_ID"
      - name: Verify cases
        id: verify
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' && steps.cases.outcome == 'success' }}
        env:
          ALL: ${{ steps.cases.outputs.all }}
          CASES: ${{ steps.cases.outputs.cases }}
          VERIFIED: ${{ steps.verified.outputs.verified }}
          VERIFIED_RUN_URL: ${{ steps.verified.outputs.run_url }}
          OPENSCI_CATALOG_DIR: ${{ github.workspace }}/run-alignment/.catalog
          OPENSCI_CATALOG_CHECK_INTERVAL: "0"
        run: |
          if [[ "$VERIFIED" == "true" ]]; then
            python scripts/verified_tree.py summary --selection all --skipped verified --run-url "$VERIFIED_RUN_URL"
            exit 0
          fi
          if [[ "$ALL" == "true" ]]; then
            selection=all
            names=(--all)
          else
            selection=changed
            read -r -a names <<< "$CASES"
            if (( ${#names[@]} == 0 )); then
              python scripts/verified_tree.py summary --selection changed --skipped none-changed
              exit 0
            fi
          fi
          status=0
          run-alignment/.venv/bin/python -m os_optics_kit cases verify "${names[@]}" --jobs 4 \
            --out run-alignment/cases > run-alignment/cases-verify.json || status=$?
          # The summary also fails (exit 1) when the exit code is 0 but cases-verify.json is missing or not MATCH.
          summary=0
          python scripts/verified_tree.py summary --selection "$selection" --verify run-alignment/cases-verify.json \
            --exit "$status" || summary=$?
          if (( status == 0 )); then status=$summary; fi
          exit "$status"
      - name: Record the full verification of this tree
        id: record
        if: >-
          ${{ !cancelled() && steps.verify.outcome == 'success' && steps.cases.outputs.all == 'true'
          && steps.verified.outputs.verified != 'true' }}
        env:
          TREE: ${{ steps.cases.outputs.tree }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/verified_tree.py record --verify run-alignment/cases-verify.json \
            --report run-alignment/report.json --tree "$TREE" --commit "$(git rev-parse HEAD)" --event "$EVENT" \
            --run-id "$RUN_ID" --out run-alignment/verified-tree/verified-tree.json
      - name: Upload the verified-tree record
        if: ${{ !cancelled() && steps.record.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.record.outputs.name }}
          path: run-alignment/verified-tree/verified-tree.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Presentation demo from the beam-expander case (review artifact)
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          OPENSCI_CATALOG_DIR: ${{ github.workspace }}/run-alignment/.catalog
          OPENSCI_CATALOG_CHECK_INTERVAL: "0"
        run: |
          kit="$PWD/run-alignment/.venv/bin/os-optics-kit"
          engine="$PWD/run-alignment/.venv/bin/os-optics"
          demo=run-alignment/presentation-demo
          mkdir -p "$demo/results" && cp -r cases/beam-expander/project.json cases/beam-expander/studies "$demo/results/"
          cd "$demo/results"
          "$engine" project run project.json --out-dir run > /dev/null
          # the swapped lens misses its target (exit 1): that run is the "before" of the demo
          "$kit" edit project.json --edits studies/beam_expander_swap_l2.json --out swapped.json --run swapped-run \
            > /dev/null || test $? -eq 1
          "$kit" sweep studies/beam_expander_l2_sweep.json --base swapped.json --out l2-sweep > /dev/null
          "$kit" edit swapped.json --edits studies/beam_expander_move_l2.json --out final.json --run final-run > /dev/null
          cd ..
          "$kit" present init results/swapped-run results/final-run results/l2-sweep --out talk --animate \
            --labels "L2 swapped,L2 moved,L2 position" --title "Beam expander: restoring collimation"
          "$kit" present build talk/presentation.json --quiet
          "$kit" present build talk/presentation.json --out talk-zh-4k --quiet --set theme.language=zh-CN \
            --set theme.background=light --set theme.font_scale=1.3 --set theme.size=4k
          "$kit" present bundle talk --out talk-bundle.zip
          rm -rf results talk/.cache talk-zh-4k/.cache
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        with:
          name: presentation-demo
          path: run-alignment/presentation-demo/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve reports, logs and runs
        id: artifact
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-checks
          path: |
            run-alignment/
            !run-alignment/.venv*/**
            !run-alignment/.catalog/**
            !run-alignment/presentation-demo/**
          if-no-files-found: warn
          retention-days: 14
      - name: Write job summary
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          python scripts/report_alignment.py run-alignment/report.json \
            --summary "$GITHUB_STEP_SUMMARY" --run-url "$RUN_URL" --artifact-url "$ARTIFACT_URL"
